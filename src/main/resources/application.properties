spring.application.name=channel-partner

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/channel_partner_db1?createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Data initialization
# Using DataInitializer.java instead of SQL scripts for user creation
spring.jpa.defer-datasource-initialization=false

# Server Configuration
server.port=2026

# Logging Configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
jwt.secret=myVeryLongSecretKeyThatIsAtLeast256BitsLongForJWTSigningPurposesOfThisApplicationWhichIsRequiredByTheJWASpecification
jwt.expiration=86400000

# Allow circular references
spring.main.allow-circular-references=true
